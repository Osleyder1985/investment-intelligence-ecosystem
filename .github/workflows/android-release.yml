name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release candidate APK
        run: gradle :app:assembleDebug

      - name: Prepare APK and SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_SOURCE"
          APK_NAME="IIE-Android-${GITHUB_REF_NAME}.apk"
          cp "$APK_SOURCE" "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: IIE Android ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-preview') || contains(github.ref_name, '-rc') }}
          files: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          fail_on_unmatched_files: true
