name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Test, sign, build and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate and install release signing key
        shell: bash
        env:
          IIE_KEYSTORE_BASE64: ${{ secrets.IIE_KEYSTORE_BASE64 }}
          IIE_KEYSTORE_PASSWORD: ${{ secrets.IIE_KEYSTORE_PASSWORD }}
          IIE_KEY_ALIAS: ${{ secrets.IIE_KEY_ALIAS }}
          IIE_KEY_PASSWORD: ${{ secrets.IIE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in IIE_KEYSTORE_BASE64 IIE_KEYSTORE_PASSWORD IIE_KEY_ALIAS IIE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/iie-release.jks"
          printf '%s' "$IIE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "IIE_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "IIE_KEYSTORE_PASSWORD=$IIE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "IIE_KEY_ALIAS=$IIE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "IIE_KEY_PASSWORD=$IIE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build signed release APK
        run: gradle :app:assembleRelease

      - name: Verify APK signature and prepare SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_SOURCE"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_SOURCE"
          APK_NAME="IIE-Android-${GITHUB_REF_NAME}.apk"
          cp "$APK_SOURCE" "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: IIE Android ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-preview') || contains(github.ref_name, '-rc') }}
          files: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          fail_on_unmatched_files: true
