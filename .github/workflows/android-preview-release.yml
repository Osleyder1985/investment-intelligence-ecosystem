name: Android Preview Release

on:
  push:
    tags:
      - "v*-preview.*"

permissions:
  contents: write

concurrency:
  group: android-preview-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK and run unit tests
        run: gradle :app:assembleDebug :app:testDebugUnitTest

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/IIE-Android-${GITHUB_REF_NAME}.apk"
          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: IIE Android ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
