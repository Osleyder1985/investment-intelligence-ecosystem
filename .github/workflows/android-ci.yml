name: Android CI

on:
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  push:
    branches:
      - "feat/android-*"

# Push and pull_request events for the same branch share one CI concurrency group.
# New commits supersede stale builds instead of queueing multiple emulator jobs.
concurrency:
  group: android-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    # Hard upper bound for the entire job; emulator boot and test execution
    # also have their own smaller limits below.
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build app and compile Android tests
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest

      - name: Run instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # Do not let ADB boot polling consume the whole job.
          emulator-boot-timeout: 300
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set +e
            timeout --signal=TERM --kill-after=30s 12m gradle :app:connectedDebugAndroidTest
            test_status=$?
            exit $test_status

      - name: Capture emulator diagnostics
        if: always()
        run: |
          mkdir -p app/build/reports/androidTests/connected/debug
          timeout 10s adb devices -l > app/build/reports/androidTests/connected/debug/adb-devices.txt 2>&1 || true
          timeout 15s adb -s emulator-5554 logcat -d -v threadtime > app/build/reports/androidTests/connected/debug/logcat.txt 2>&1 || true

      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-diagnostics
          path: |
            app/build/reports/androidTests/connected/debug/
            app/build/outputs/androidTest-results/connected/debug/
          if-no-files-found: ignore

      - name: Upload generated Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-android
          path: app/schemas/
          if-no-files-found: warn
