name: Android CI

on:
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  push:
    branches:
      - "feat/android-*"

# Push and pull_request events for the same branch share one CI concurrency group.
concurrency:
  group: android-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Hosted CI validates compilation and local JVM tests.
      # Instrumentation APKs are compiled here, but emulator execution is
      # deliberately excluded until the hosted ADB boot instability is resolved.
      - name: Build app and compile Android tests; run unit tests
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest

  android-instrumented-tests:
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The emulator action has a bounded boot timeout; no unbounded ADB polling.
      - name: Run Room instrumentation tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: gradle :app:connectedDebugAndroidTest

      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-test-reports
          path: app/build/reports/androidTests/connected/
          if-no-files-found: warn

      - name: Upload Android APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: |
            app/build/outputs/apk/debug/
            app/build/outputs/apk/androidTest/debug/
          if-no-files-found: warn

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload generated Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-android
          path: app/schemas/
          if-no-files-found: warn
