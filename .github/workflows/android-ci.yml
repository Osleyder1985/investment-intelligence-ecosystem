name: Android CI

on:
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  push:
    branches:
      - "feat/android-*"

# Push and pull_request events for the same branch share one CI concurrency group.
concurrency:
  group: android-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build app and compile Android tests; run unit tests
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest

      - name: Upload Android APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: |
            app/build/outputs/apk/debug/
            app/build/outputs/apk/androidTest/debug/
          if-no-files-found: warn

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload generated Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-android
          path: app/schemas/
          if-no-files-found: warn

  android-instrumented-tests:
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install API 35 emulator image and create AVD
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          echo "no" | avdmanager create avd --force --name iie-api35 --package "system-images;android-35;google_apis;x86_64" --device "pixel_2"

          echo "Created AVD files:"
          ls -la "$ANDROID_AVD_HOME"
          test -f "$ANDROID_AVD_HOME/iie-api35.ini"
          avdmanager list avd

      - name: Enable KVM access for the emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "KVM device /dev/kvm is not available on this runner."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Start emulator with bounded boot detection
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_AVD_HOME:=$HOME/.android/avd}"
          test -f "$ANDROID_AVD_HOME/iie-api35.ini"
          "$ANDROID_HOME/emulator/emulator" -avd iie-api35 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none > "$RUNNER_TEMP/iie-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > "$RUNNER_TEMP/iie-emulator.pid"

          for attempt in $(seq 1 60); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited before boot completed."
              cat "$RUNNER_TEMP/iie-emulator.log"
              exit 1
            fi

            BOOT_STATE="$(timeout 10s adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            echo "Boot check $attempt/60: sys.boot_completed='${BOOT_STATE}'"
            if [ "$BOOT_STATE" = "1" ]; then
              adb -s emulator-5554 shell settings put global window_animation_scale 0
              adb -s emulator-5554 shell settings put global transition_animation_scale 0
              adb -s emulator-5554 shell settings put global animator_duration_scale 0
              exit 0
            fi
            sleep 5
          done

          echo "Emulator did not finish booting within 300 seconds."
          adb devices -l || true
          cat "$RUNNER_TEMP/iie-emulator.log"
          exit 1

      - name: Run Room instrumentation tests
        run: gradle :app:connectedDebugAndroidTest

      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          adb -s emulator-5554 emu kill || true
          if [ -f "$RUNNER_TEMP/iie-emulator.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/iie-emulator.pid")" 2>/dev/null || true
          fi

      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-test-reports
          path: app/build/reports/androidTests/connected/
          if-no-files-found: warn
